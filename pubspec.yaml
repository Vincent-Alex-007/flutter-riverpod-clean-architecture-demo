name: riverpod_template
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  dio_smart_retry: ^7.0.1
  drift: ^2.31.0
  envied: ^1.3.4
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  flutter_timezone: ^5.0.2
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.1.0
  hooks_riverpod: ^3.3.1
  injectable: ^2.7.1+4
  intl: ^0.20.2
  json_annotation: ^4.11.0
  path: ^1.9.1
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.2
  shared_preferences: ^2.5.4
  sqlite3_flutter_libs: ^0.6.0+eol
  talker_dio_logger: ^5.1.15
  talker_flutter: ^5.1.15
  talker_riverpod_logger: ^5.1.14
  timezone: ^0.11.0



  vector_graphics: any
  web_socket_channel: ^3.0.3
dev_dependencies:
  build_runner: ^2.13.1
  drift_dev: ^2.31.0
  envied_generator: ^1.3.4
  flutter_gen_runner: ^5.13.0+1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  go_router_builder: ^4.2.0
  injectable_generator: ^2.11.1
  json_serializable: ^6.13.0
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3


# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/icons/
